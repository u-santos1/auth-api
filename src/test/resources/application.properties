# Banco local para testes
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_api_db
spring.datasource.username=admin
spring.datasource.password=senha_secreta
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT
api.security.token.secret=chave_local_para_testes_minimo_32_caracteres_ok